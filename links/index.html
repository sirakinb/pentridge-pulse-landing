<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Pentridge Links</title>
<meta name="description" content="Automation Hour, the checklist, and everything else from Pentridge in one place." />
<meta property="og:title" content="Pentridge Links" />
<meta property="og:description" content="Grab the Zoom link for Automation Hour, then everything else." />
<meta property="og:type" content="website" />
<meta name="theme-color" content="#000000" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Geist+Mono:wght@400;500;600;700&display=swap" rel="stylesheet" />
<link href="https://fonts.googleapis.com/css2?family=Geist:wght@300;400;500;600;700;900&display=swap" rel="stylesheet" />
<style>
  @font-face{
    font-family:"Geist Pixel Grid";
    src:url("https://framerusercontent.com/assets/YaojHCyVaDBwfMKRVDPYlrmjG88.woff2") format("woff2");
    font-display:swap;font-style:normal;font-weight:400;
  }
  :root{
    --bg:#000;
    --muted:rgba(255,255,255,.62); --muted2:rgba(255,255,255,.42); --ink:#fafafa;
    --purple:#a855f7; --pink:#ec4899; --purple6:#9333ea; --pink6:#db2777;
    --fill:rgba(255,255,255,.045); --fill-hover:rgba(168,85,247,.14);
    --line:rgba(255,255,255,.1);
    --radius:1.15rem;
    --font-body:'Geist','Geist Variable',system-ui,-apple-system,sans-serif;
    --font-mono:'Geist Mono',monospace;
    --font-display:'Geist Pixel Grid',sans-serif;
  }
  *{box-sizing:border-box}
  html,body{margin:0;padding:0}
  body{
    background:var(--bg);color:var(--ink);min-height:100vh;font-family:var(--font-body);
    line-height:1.55;-webkit-font-smoothing:antialiased;
    background-image:radial-gradient(820px 480px at 50% -8%, rgba(168,85,247,.2), transparent 58%);
    background-attachment:fixed;
  }
  ::-webkit-scrollbar{width:6px}
  ::-webkit-scrollbar-track{background:#0a0a0a}
  ::-webkit-scrollbar-thumb{background:rgba(168,85,247,.3);border-radius:3px}
  svg{display:block}
  button,input{font-family:inherit}

  .wrap{max-width:440px;margin:0 auto;padding:48px 20px 88px}

  .avatar{
    width:92px;height:92px;border-radius:50%;margin:0 auto 18px;
    padding:3px;background:linear-gradient(135deg,var(--purple),var(--pink));
    box-shadow:0 0 36px rgba(168,85,247,.28);
  }
  .avatar-inner{width:100%;height:100%;border-radius:50%;overflow:hidden;background:#0a0a0a}
  .avatar-inner img{width:100%;height:100%;object-fit:cover;display:block}

  .name{font-family:var(--font-display);letter-spacing:-.04em;font-weight:400;font-size:clamp(28px,8vw,40px);margin:0;line-height:1;text-align:center}
  .handle{margin-top:10px;text-align:center;font-family:var(--font-mono);font-size:12px;letter-spacing:.14em;color:var(--muted)}
  .bio{margin:16px auto 0;max-width:34em;text-align:center;font-size:14.5px;color:var(--muted);line-height:1.55}

  .socials{display:flex;justify-content:center;flex-wrap:wrap;gap:10px;margin:22px 0 0}
  .social{
    width:46px;height:46px;border-radius:13px;display:flex;align-items:center;justify-content:center;
    background:var(--fill);color:var(--ink);text-decoration:none;
    transition:background .16s,transform .1s,color .16s;
  }
  .social:hover{background:var(--fill-hover);color:#fff}
  .social:active{transform:translateY(1px)}
  .social svg{width:20px;height:20px;fill:currentColor}
  .social svg[fill="none"]{fill:none;stroke:currentColor}

  .session{
    margin-top:28px;text-align:left;background:rgba(255,255,255,.035);
    border:1px solid var(--line);border-radius:22px;overflow:hidden;
  }
  .session-hero{
    position:relative;height:168px;overflow:hidden;
    background:
      radial-gradient(120px 80px at 78% 30%, rgba(236,72,153,.28), transparent 70%),
      radial-gradient(180px 120px at 18% 80%, rgba(168,85,247,.32), transparent 70%),
      linear-gradient(180deg,#12061d 0%, #07040d 100%);
  }
  .session-ring{
    position:absolute;inset:50% auto auto 50%;
    width:210px;height:210px;margin:-105px 0 0 -105px;
    opacity:.55;
  }
  .session-time{
    position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;
    font-family:var(--font-display);font-size:64px;letter-spacing:-.06em;line-height:.9;color:#fff;
    text-shadow:0 0 40px rgba(168,85,247,.45);
  }
  .session-tz{display:block;margin-top:8px;font-family:var(--font-mono);font-size:11px;letter-spacing:.28em;color:rgba(255,255,255,.55)}

  .session-body{padding:20px 18px 18px}
  .session-meta{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:10px}
  .pill{
    display:inline-flex;align-items:center;gap:6px;
    font-family:var(--font-mono);font-size:11px;letter-spacing:.08em;
    color:#e9d5ff;background:rgba(168,85,247,.16);border:1px solid rgba(168,85,247,.28);
    border-radius:999px;padding:5px 9px;
  }
  .when{font-family:var(--font-mono);font-size:12px;color:var(--muted);letter-spacing:.01em}
  .session h2{
    margin:0;font-family:var(--font-display);font-size:clamp(28px,8vw,34px);
    letter-spacing:-.04em;line-height:1;font-weight:400;
  }
  .session-blurb{margin:10px 0 0;font-size:14.5px;color:var(--muted);line-height:1.5}

  .session-form{margin-top:16px;display:grid;gap:8px}
  .session-form input{
    width:100%;background:rgba(0,0,0,.35);border:1px solid rgba(255,255,255,.12);
    border-radius:10px;padding:12px 13px;color:#fff;font-size:15px;outline:none;
    transition:border-color .16s,background .16s;
  }
  .session-form input::placeholder{color:rgba(255,255,255,.34)}
  .session-form input:focus{border-color:rgba(168,85,247,.55);background:rgba(168,85,247,.08)}
  .session-form button{
    position:relative;isolation:isolate;overflow:hidden;
    width:100%;margin-top:6px;padding:14px 16px;border:0;border-radius:12px;cursor:pointer;
    color:#fff;font-family:var(--font-mono);font-weight:600;font-size:13px;
    letter-spacing:.16em;text-transform:uppercase;
    display:inline-flex;align-items:center;justify-content:center;gap:10px;
    background:#07040d;
    box-shadow:0 0 0 1px rgba(168,85,247,.35), 0 10px 28px rgba(168,85,247,.38), inset 0 1px 0 rgba(255,255,255,.12);
    transition:transform .12s, box-shadow .2s, filter .2s;
  }
  .session-form button::before{
    content:"";position:absolute;inset:-70%;z-index:0;pointer-events:none;
    background:conic-gradient(from 180deg, transparent 55%, rgba(236,72,153,.7), rgba(168,85,247,.85), transparent 72%);
    animation:btn-spin 3.8s linear infinite;
  }
  .session-form button::after{
    content:"";position:absolute;inset:1px;z-index:0;border-radius:11px;pointer-events:none;
    background:linear-gradient(180deg, rgba(168,85,247,.34), rgba(7,4,13,.94) 46%, #05030a);
  }
  .session-form button svg,
  .session-form button span{position:relative;z-index:1}
  .session-form button svg{width:16px;height:16px;flex:0 0 auto}
  .session-form button:hover{
    transform:translateY(-1px);
    box-shadow:0 0 0 1px rgba(236,72,153,.35), 0 14px 36px rgba(168,85,247,.5);
    filter:brightness(1.08);
  }
  .session-form button:active{transform:translateY(1px)}
  .session-form button:disabled{opacity:.45;cursor:not-allowed;filter:none;box-shadow:none;animation:none}
  .form-error{margin:12px 0 0;font-size:13px;color:#f9a8d4;text-align:center}
  @keyframes btn-spin{to{transform:rotate(360deg)}}
  .form-success{display:none;text-align:center;padding:10px 4px 4px;font-size:14px;color:#d8b4fe;font-weight:500}

  .links{display:grid;gap:12px;margin-top:18px}
  .link{
    display:flex;align-items:center;gap:14px;text-decoration:none;cursor:pointer;
    background:var(--fill);border-radius:var(--radius);padding:15px 16px;
    transition:background .16s,transform .1s;
  }
  .link:hover{background:var(--fill-hover)}
  .link:active{transform:translateY(1px)}
  .link .ic{flex:0 0 auto;width:40px;height:40px;border-radius:11px;display:flex;align-items:center;justify-content:center;background:rgba(255,255,255,.06);color:#fff}
  .link .ic svg{width:20px;height:20px}
  .link .txt{flex:1;min-width:0}
  .link .label{display:block;font-weight:600;font-size:15px;color:var(--ink)}
  .link .sub{display:block;font-size:12.5px;color:var(--muted2);margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .link .arrow{flex:0 0 auto;color:var(--muted2);transition:color .16s,transform .16s}
  .link .arrow svg{width:18px;height:18px}
  .link:hover .arrow{color:var(--purple);transform:translateX(2px)}
  .link.featured{
    background:linear-gradient(135deg,rgba(168,85,247,.22),rgba(236,72,153,.08) 70%);
    box-shadow:0 0 0 1px rgba(168,85,247,.35), 0 10px 30px rgba(168,85,247,.18);
  }
  .link.featured:hover{background:linear-gradient(135deg,rgba(168,85,247,.32),rgba(236,72,153,.14) 70%)}
  .link.featured .ic{background:linear-gradient(135deg,var(--purple),var(--pink))}
  .link.featured .sub{color:#e9d5ff}
  .link.event{cursor:default;flex-direction:column;align-items:stretch}
  .link.event:hover{background:var(--fill)}
  .link.event .event-copy{display:flex;align-items:center;gap:14px}
  .link.event .rsvp{
    display:block;text-align:center;text-decoration:none;color:#fff;font-family:var(--font-mono);
    font-size:10px;font-weight:700;letter-spacing:.14em;text-transform:uppercase;
    padding:10px 16px;border-radius:9px;border:1px solid rgba(168,85,247,.38);
    background:linear-gradient(180deg,rgba(168,85,247,.28),rgba(168,85,247,.12));
    transition:transform .1s,background .16s,border-color .16s;
  }
  .link.event .rsvp:hover{background:linear-gradient(180deg,rgba(168,85,247,.42),rgba(168,85,247,.2));border-color:rgba(216,180,254,.65)}
  .link.event .rsvp:active{transform:translateY(1px)}

  .oh-toast{
    position:fixed;bottom:28px;left:50%;transform:translateX(-50%) translateY(20px);
    background:#141414;border:1px solid rgba(168,85,247,.35);border-radius:14px;
    padding:14px 18px;max-width:320px;width:calc(100% - 40px);
    box-shadow:0 8px 32px rgba(0,0,0,.6);
    display:flex;align-items:flex-start;gap:12px;
    opacity:0;transition:opacity .25s,transform .3s;pointer-events:none;z-index:999;
  }
  .oh-toast.show{opacity:1;transform:translateX(-50%) translateY(0);pointer-events:auto}
  .oh-toast-icon{
    flex:0 0 auto;width:32px;height:32px;border-radius:9px;
    background:linear-gradient(135deg,rgba(168,85,247,.3),rgba(236,72,153,.2));
    display:flex;align-items:center;justify-content:center;
  }
  .oh-toast-icon svg{width:16px;height:16px;stroke:#c084fc;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
  .oh-toast-title{font-weight:600;font-size:14px;color:#fff;margin:0 0 2px}
  .oh-toast-msg{font-size:13px;color:var(--muted);margin:0;line-height:1.45}

  @media (prefers-reduced-motion: reduce){
    .link,.social,.session-form button,.oh-toast{transition:none}
    .session-form button::before{animation:none}
  }
</style>
</head>

function qp(n){ try { return new URLSearchParams(location.search).get(n) || null; } catch(e){ return null; } }
var VISIT = { referrer: document.referrer || null, utm_source: qp("utm_source"), utm_medium: qp("utm_medium"), utm_campaign: qp("utm_campaign") };

function track(o){
  var payload = JSON.stringify({
    link_id: o.id, link_label: o.label || o.id, destination_url: o.url || "",
    referrer: VISIT.referrer, utm_source: VISIT.utm_source, utm_medium: VISIT.utm_medium, utm_campaign: VISIT.utm_campaign
  });
  try { var b = new Blob([payload], { type:"text/plain" }); if (navigator.sendBeacon && navigator.sendBeacon(TRACK_URL, b)) return; } catch(e){}
  try { fetch(TRACK_URL, { method:"POST", body:payload, headers:{"Content-Type":"text/plain"}, keepalive:true }); } catch(e){}
}

(function(){
  document.getElementById("name").textContent = PROFILE.name || "";
  document.getElementById("handle").textContent = PROFILE.handle || "";
  document.getElementById("bio").textContent = PROFILE.bio || "";
  var img = document.getElementById("avatar-img");
  if (PROFILE.avatar) {
    img.src = PROFILE.avatar;
    img.alt = PROFILE.name || "";
  } else {
    document.getElementById("avatar").style.display = "none";
  }
})();

(function(){
  document.getElementById("session-clock").textContent = SESSION.clock;
  document.getElementById("session-badge").textContent = SESSION.badge;
  document.getElementById("session-when").textContent = SESSION.when;
  document.getElementById("session-title").textContent = SESSION.title;
  document.getElementById("session-blurb").textContent = SESSION.blurb;
  document.getElementById("ah-submit-label").textContent = SESSION.cta;
})();

(function(){
  var box = document.getElementById("socials");
  SOCIALS.forEach(function(s){
    var a = document.createElement("a");
    a.className = "social";
    a.href = s.url; a.target = "_blank"; a.rel = "noopener noreferrer";
    a.setAttribute("aria-label", s.id);
    a.innerHTML = ICONS[s.icon] || "";
    a.addEventListener("click", function(){ track({ id:s.id, label:s.id, url:s.url }); });
    box.appendChild(a);
  });
})();

(function(){
  var box = document.getElementById("links");
  LINKS.forEach(function(link){
    if (link.cta) {
      var card = document.createElement("div");
      card.className = "link event";
      card.innerHTML =
        '<span class="event-copy"><span class="ic">' + (ICONS[link.icon] || "") + '</span>' +
        '<span class="txt"><span class="label">' + link.label + '</span>' +
        (link.sub ? '<span class="sub">' + link.sub + '</span>' : '') + '</span></span>' +
        '<a class="rsvp" href="' + link.url + '" target="_blank" rel="noopener noreferrer">' + link.cta + '</a>';
      card.querySelector(".rsvp").addEventListener("click", function(){ track(link); });
      box.appendChild(card);
      return;
    }
    var a = document.createElement("a");
    a.className = "link" + (link.featured ? " featured" : "");
    a.href = link.url;
    if (!link.featured) { a.target = "_blank"; a.rel = "noopener noreferrer"; }
    a.innerHTML =
      '<span class="ic">' + (ICONS[link.icon] || "") + '</span>' +
      '<span class="txt"><span class="label">' + link.label + '</span>' +
      (link.sub ? '<span class="sub">' + link.sub + '</span>' : '') + '</span>' +
      '<span class="arrow">' + ICONS.arrow + '</span>';
    a.addEventListener("click", function(){ track(link); });
    box.appendChild(a);
  });
})();

(function(){
  var form = document.getElementById("session-form");
  var btn = document.getElementById("ah-submit");
  var success = document.getElementById("ah-success");
  form.addEventListener("submit", function(e){
    e.preventDefault();
    var fname = (document.getElementById("ah-fname").value || "").trim();
    var email = (document.getElementById("ah-email").value || "").trim();
    if (!fname || !email || !email.includes("@")) {
      document.getElementById(!fname ? "ah-fname" : "ah-email").focus();
      return;
    }
    var err = document.getElementById("ah-error");
    err.hidden = true;
    btn.disabled = true;
    document.getElementById("ah-submit-label").textContent = "Sending…";
    track({ id: SESSION.id, label: SESSION.title, url: "" });
    fetch(MANOR_SIGNUP_URL, {
      method: "POST",
      headers: { "Content-Type": "text/plain" },
      body: JSON.stringify({ first_name: fname, email: email })
    }).then(function(res){
      if (!res.ok) throw new Error("signup failed");
      btn.style.display = "none";
      document.getElementById("ah-fname").style.display = "none";
      document.getElementById("ah-email").style.display = "none";
      success.style.display = "block";
      var toast = document.getElementById("oh-toast");
      if (toast) {
        toast.classList.add("show");
        setTimeout(function(){ toast.classList.remove("show"); }, 5000);
      }
    }).catch(function(){
      btn.disabled = false;
      document.getElementById("ah-submit-label").textContent = "Get the Zoom link";
      document.getElementById("ah-error").hidden = false;
    });
  });
})();
</script>
